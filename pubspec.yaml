name: munka
description: "timeshit app tu trakk ur wurk."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: any
  json_annotation: ^4.12.0
  material_ui: ^1.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16/DotGothic16-Regular.ttf
          style: normal
          weight: 400
    - family: Oi
      fonts:
        - asset: assets/fonts/Oi/Oi-Regular.ttf
          style: normal
          weight: 400

